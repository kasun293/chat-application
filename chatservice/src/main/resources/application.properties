spring.application.name=chatservice
server.port=8080

# Force Hibernate to store dates in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Ensure Jackson (JSON) formats dates as ISO strings instead of timestamps
#spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

logging.level.org.springframework=WARN
# Example for MySQL
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect


spring.datasource.url=jdbc:mysql://${DB_SOURCE}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.liquibase.change-log=classpath:db/liquibase/master.xml

#logging.level.org.springframework.security = TRACE
#logging.level.org.springframework.security=DEBUG


spring.jpa.hibernate.ddl-auto = none

app.jwt-secret=${JWT_SECRET}
app.jwt-expiration-milliseconds=604800000

spring.main.allow-bean-definition-overriding=true

spring.jpa.open-in-view=false

# swagger-ui custom path
#springdoc.swagger-ui.path=/swagger-ui.html

# /api-docs endpoint custom path
#springdoc.api-docs.path=/api-docs
