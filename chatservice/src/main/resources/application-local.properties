spring.application.name=chatservice
#server.servlet.context-path=/chat-server
server.port=8080
#use random port
#server.port=0
# Force Hibernate to store dates in UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Ensure Jackson (JSON) formats dates as ISO strings instead of timestamps
#spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

logging.level.org.springframework=WARN
# Example for MySQL
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

spring.datasource.url=jdbc:mysql://${DB_SOURCE}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none

#logging.level.org.springframework.security = TRACE
#logging.level.org.springframework.security=DEBUG


app.jwt-secret=daf66e01593f61a15b857cf433aae03a005812b31234e149036bcc8dee755dbb
app.jwt-expiration-milliseconds=604800000

spring.main.allow-bean-definition-overriding=true

spring.jpa.open-in-view=false

# swagger-ui custom path
#springdoc.swagger-ui.path=/swagger-ui.html

# /api-docs endpoint custom path
#springdoc.api-docs.path=/api-docs
spring.liquibase.enabled=true

eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL}
#eureka.client.eureka-service-url-poll-interval-seconds=30