apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service-deployment
  labels:
    app: chat-service-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: chat-service-app
  template:
    metadata:
      labels:
        app: chat-service-app
    spec:
      containers:
        - name: chat-service-app
          image: localhost/chat-service:v3
          args:
            - "--spring.profiles.active=k8s"
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
spec:
  type: NodePort
  selector:
    app: chat-service-app
  ports:
    - port: 80
      protocol: TCP
      targetPort: 8080
#      nodePort: 30080
